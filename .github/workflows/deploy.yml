name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Once a day, 18:10 UTC, about forty minutes after the channel's usual 17:30 UTC Short, so the
  # front page's video block (scripts/fetch-videos.mjs, below) is never more than a day behind
  # YouTube even on a day when no desk pushes. It rebuilds and redeploys main as it stands: no
  # commit is made, and the data guard still runs first. GitHub runs schedules late under load.
  schedule:
    - cron: '10 18 * * *'

# Read-only by default. Only the deploy job, which runs no npm code, can publish to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Runs before the build and blocks it: a push that shrinks or rewinds any desk-written data
  # file (DATA_FILES in scripts/data-files.sh) never reaches Pages. It compares against the
  # commit the last successful run of this workflow built, so a blocked shrink stays red on
  # every later push (a desk commit on top does not carry it live) until the data is restored
  # or a commit carries a Data-Shrink-OK trailer. The pre-push SHA is the fallback.
  data-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # Full commit history but no file contents beyond scripts/ and src/data/ at HEAD; the
      # guard fetches the few older blobs it reads on demand. Keeps public/media out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts
            src/data
      - name: Fail if a key, env or agent-log file is tracked
        run: bash scripts/check-tracked-secrets.sh
      - name: Find the last deployed commit
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].head_sha // empty' || true)
          echo "Last successful deploy: ${sha:-none found}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Fail if desk data files shrank
        env:
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/check-data-shrink.sh "$DEPLOYED_SHA" "$BEFORE_SHA"

  build:
    needs: data-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The front page's video block. Reads two public YouTube feeds (no key), copies each
      # thumbnail into public/media/videos/ and rewrites scripts/data/videos.json for this build
      # only; nothing is committed. On any failure it keeps the committed snapshot and exits 0, and
      # continue-on-error covers a crash, so YouTube can never stop a deploy.
      - name: Refresh the video list
        continue-on-error: true
        run: node scripts/fetch-videos.mjs
      - run: npm run build
      # The commit this artifact was built from, so "Verify live" can tell this deployment from
      # the one before it.
      - name: Stamp the build
        run: printf '%s\n' "$GITHUB_SHA" > dist/build.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live
        run: |
          set -e
          # A 200 alone proves nothing: the previous deployment answers 200 too. Wait until the
          # live build stamp is this run's commit.
          ready=""
          for i in $(seq 1 15); do
            live=$(curl -fsS "https://thearchv.ca/build.txt?cb=$(date +%s)" 2>/dev/null | tr -d '[:space:]' || true)
            echo "Attempt $i: live build.txt -> ${live:-none}"
            if [ "$live" = "$GITHUB_SHA" ]; then ready=1; break; fi
            echo "This build ($GITHUB_SHA) is not live yet, sleeping 20s..."
            sleep 20
          done
          if [ -z "$ready" ]; then
            echo "::error::thearchv.ca/build.txt never showed $GITHUB_SHA after 15 attempts (this build may not have deployed)"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://thearchv.ca/feed/index.json?cb=$(date +%s)")
          echo "feed/index.json -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::feed/index.json returned $code on the new build"
            exit 1
          fi
          today_json=$(curl -fsS "https://thearchv.ca/feed/today.json?cb=$(date +%s)")
          image=$(echo "$today_json" | jq -r '.lead.image // empty')
          if [ -n "$image" ]; then
            img_code=$(curl -s -o /dev/null -w "%{http_code}" "https://thearchv.ca${image}")
            echo "Lead image https://thearchv.ca${image} -> ${img_code}"
            if [ "$img_code" != "200" ]; then
              echo "::error::live lead image https://thearchv.ca${image} returned ${img_code} — failing deploy"
              exit 1
            fi
          else
            echo "No lead image on live today.json; nothing to verify."
          fi
          echo "Verify live: passed."
