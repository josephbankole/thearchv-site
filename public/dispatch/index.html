  <style>
    :root {
      --navy: #F4F1EA;
      --navy-deep: #EAE6DC;
      --cream: #1E223D;
      --cream-dim: #4C5176;
      --gold: #B23109;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* No fixed heights anywhere (2026-07-22): same defect family as the /start laptop
       cut-off. min-height:100svh lets the body grow; html carries the base colour so
       overscroll never flashes the UA canvas. */
    html { background: var(--navy-deep); }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background: radial-gradient(120% 80% at 50% 0%, #FAF8F3 0%, var(--navy) 45%, var(--navy-deep) 100%);
      color: var(--cream);
      font-family: "Inter Tight", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { width: 100%; max-width: 460px; text-align: center; }

    .wordmark {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.5rem;
      color: var(--cream);
      letter-spacing: 0.01em;
    }
    .wordmark a { color: inherit; text-decoration: none; }
    .wordmark .dot { color: var(--gold); }
    .wordmark a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 300;
      font-size: clamp(2rem, 8vw, 2.6rem);
      line-height: 1.05;
      margin-top: 26px;
      color: var(--cream);
    }
    .lede {
      margin-top: 16px;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--cream-dim);
    }

    .cta { margin-top: 28px; }
    .cta a {
      display: block;
      padding: 16px 22px;
      border-radius: 12px;
      background: var(--gold);
      color: #FFFFFF;  /* 6.29:1 on the accent */
      text-decoration: none;
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .cta a:hover { filter: brightness(1.06); }
    .cta a:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }

    .back { margin-top: 22px; }
    .back a { color: var(--cream-dim); font-size: 0.9rem; letter-spacing: 0.02em; text-decoration: underline; text-underline-offset: 3px; }
    .back a:hover { color: var(--cream); }
    .back a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .skip { position: fixed; top: -100px; left: 1rem; z-index: 200; background: var(--cream); color: var(--navy); padding: .6rem 1rem; border-radius: 2px; }
    .skip:focus { top: 1rem; }
  </style>

  <a class="skip" href="#main">Skip to content</a>
  <main class="wrap" id="main">
    <div class="wordmark"><a href="/">The ARCHV<span class="dot">.</span></a></div>
    <h1>The Dispatch is paused</h1>
    <p class="lede">No new issues are going out for now. Our long reads are on this site.</p>
    <p class="cta"><a href="/reads/">Every long read</a></p>
    <p class="back"><a href="/">Back to the archive</a></p>
  </main>
